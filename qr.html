<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مولد QR Code</title>

<link rel="stylesheet" href="qr.css">

</head>

<style>
.home-btn{
display:inline-block;
padding:10px 20px;
background:#0077ff;
color:white;
text-decoration:none;
border-radius:8px;
margin:15px;
}
</style>
<body>
<a href="index.html" class="home-btn">🏠 الصفحة الرئيسية</a>

<h1>📱 مولد QR Code</h1>


<div class="box">


<h3>النص أو الرابط</h3>

<input id="text" 
placeholder="اكتب نص أو رابط">


<h3>لون QR</h3>

<input type="color" id="color" value="#000000">


<button onclick="generateQR()">
إنشاء QR
</button>


<img id="qr">


<a id="download" download="QR.png">
<button>
⬇️ تحميل QR
</button>
</a>


<hr>


<h2>📶 QR WiFi</h2>


<input id="wifiName"
placeholder="اسم WiFi">


<input id="wifiPass"
placeholder="كلمة السر">


<button onclick="wifiQR()">
إنشاء WiFi QR
</button>



<hr>


<h2>🟢 QR WhatsApp</h2>


<input id="phone"
placeholder="رقم الهاتف مثال 212600000000">


<input id="message"
placeholder="الرسالة">


<button onclick="whatsappQR()">
إنشاء WhatsApp QR
</button>



</div>


<script src="qr.js"></script>


</body>

</html>
