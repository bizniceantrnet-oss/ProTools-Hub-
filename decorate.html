<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زخرفة الأسماء</title>

    <link rel="stylesheet" href="style.css">
</head>
<style>
.home-btn{
display:inline-block;
padding:10px 20px;
background:#0077ff;
color:white;
text-decoration:none;
border-radius:8px;
margin:15px;
}
</style>
<body>
<a href="index.html" class="home-btn">🏠 الصفحة الرئيسية</a>
<header>
    <h1>✨ زخرفة الأسماء ✨</h1>
    <p>زخرف اسمك بالعربي أو الإنجليزي مجانًا.</p>

</header>

<main class="container">

    <input
        type="text"
        id="name"
        placeholder="اكتب اسمك هنا">

    <div class="buttons">
        <button id="decorateBtn">زخرف</button>
        <button id="clearBtn">مسح</button>
    </div>

    <h2>النتائج</h2>

    <div id="result" class="results">
        <p class="empty">اكتب اسمك ثم اضغط على زر زخرف.</p>
    </div>

</main>

<footer>
    <p>© 2026 زخرفة الأسماء</p>
</footer>

<script src="script.js"></script>

</body>
</html>
