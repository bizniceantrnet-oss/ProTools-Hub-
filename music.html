<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BeatForge AI - Music Studio</title>

<link rel="stylesheet" href="music.css">

</head>


<body>


<div class="background"></div>


<header>

<div class="logo">

<span>〰️</span>
BeatForge AI
<span>✨</span>

</div>

</header>



<main>


<section class="hero">


<h1>
🎵 حوّل كلماتك إلى أغنية
</h1>


<p>
اصنع أغاني احترافية بالذكاء الاصطناعي في ثواني
</p>



<div class="studio-card">



<h2>
✍️ اكتب فكرة الأغنية
</h2>


<textarea 
id="lyrics"
placeholder="اكتب كلمات أو فكرة الأغنية هنا...">
</textarea>



<div class="word-count">

الكلمات:
<span id="count">0</span>

</div>



<h2>
🎼 اختر الأسلوب
</h2>


<div class="options">


<button class="option">
🎤 Rap
</button>


<button class="option">
🎵 Pop
</button>


<button class="option">
🔥 Trap
</button>


<button class="option">
😂 Funny
</button>


<button class="option">
💔 Sad
</button>


</div>





<h2>
🎤 اختر الصوت
</h2>



<div class="voices">


<button class="voice">

👨
<br>
Male

</button>


<button class="voice">

👩
<br>
Female

</button>


<button class="voice">

🤖
<br>
AI Voice

</button>


</div>




<button id="create-song">

✨ Create Song

</button>



</div>



<!-- نتيجة الأغنية -->

<section class="result-card">


<h2>
🎧 أغنيتك جاهزة
</h2>



<div class="cover">

🖼️

</div>




<div class="player">


<button>
▶️
</button>


<button>
❤️
</button>


<button>
⬇️
</button>


<button>
📤
</button>



</div>


</section>



</section>


</main>





<!-- موجات الصوت -->

<div class="sound-wave">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>





<!-- دائرة الطاقة -->

<div class="energy-circle">

<div class="energy-core">

🎵

</div>

</div>





<script src="music.js"></script>


</body>

</html>
